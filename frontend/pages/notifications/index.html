<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | SilipMunti</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/notifications-page.css" />
    <link rel="stylesheet" href="/SilipMunti/frontend/assets/css/system-modal.css?v=1" />
    <script src="/SilipMunti/frontend/assets/js/system-modal.js?v=1"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="../../index.html" class="navbar-logo">
          <img src="../../assets/images/SilipMunti.png" alt="SilipMunti logo" />
        </a>

        <button
          type="button"
          class="mobile-menu-button"
          id="mobile-menu-button"
          aria-label="Open navigation menu"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="navbar-content" id="navbar-content">
          <ul class="navbar-links">
            <li><a href="../../index.html">Home</a></li>
            <li><a href="../properties/index.html">Properties</a></li>
            <li><a href="../../index.html#about">About</a></li>
            <li><a href="../../index.html#landlords">Landlords</a></li>
          </ul>

          <div class="user-actions" id="user-actions">
            <a
              href="index.html"
              class="notification-button active"
              aria-label="Notifications"
            >
              <i class="fa-solid fa-bell"></i>
              <span class="notification-count hidden" id="notification-count"
                >0</span
              >
            </a>

            <a
              href="../profile/index.html"
              class="page-profile-link"
              aria-label="Profile"
            >
              <img
                id="navbar-profile-picture"
                src="../../assets/images/default-profile.png"
                alt="Profile picture"
              />
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="notifications-main">
      <section class="notifications-shell">
        <div class="notifications-heading">
          <div>
            <span class="eyebrow">SilipMunti account updates</span>
            <h1>Notifications</h1>
            <p>
              Review your messages, verification results, and listing updates.
            </p>
          </div>

          <button
            type="button"
            class="refresh-button"
            id="refresh-notifications"
          >
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
        </div>

        <div class="notifications-toolbar">
          <div class="notification-tabs" id="notification-tabs">
            <button type="button" class="active" data-status="all">All</button>
            <button type="button" data-status="unread">
              Unread
              <span id="tab-unread-count" class="tab-count hidden">0</span>
            </button>
            <button type="button" data-status="read">Read</button>
          </div>

          <label class="type-filter" for="notification-type">
            <i class="fa-solid fa-filter"></i>
            <select id="notification-type">
              <option value="">All notification types</option>
              <option value="message_alert">Messages</option>
              <option value="document_status">Documents</option>
              <option value="listing_status">Listings</option>
            </select>
          </label>
        </div>

        <div
          class="notification-page-message hidden"
          id="notification-page-message"
        ></div>
        <div class="notifications-list" id="notifications-list"></div>
      </section>
    </main>

    <script src="../../assets/js/notifications-page.js"></script>
  </body>
</html>
