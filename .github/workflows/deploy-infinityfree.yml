name: Deploy SilipMunti to InfinityFree

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preview or upload website files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        env:
          NODE_OPTIONS: --tls-max-v1.2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: /htdocs/SilipMunti/
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agents/**
            **/.codex/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/backend/storage/**
            **/backend/private_uploads/**
            **/silipmunti-private/**
            **/reference-updated-files/**
            **/*.sql
            **/*.zip
            **/*.log
            **/*.bak
            **/check-system.php
            **/maintenance-check.php
            
